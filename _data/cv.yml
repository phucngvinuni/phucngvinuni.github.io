- title: Research Experience
  type: time_table
  contents:
    - title: Research Intern
      institution: <a href="https://aiot.hku.hk/" target="_blank">HKU AIoT Lab</a>, The University of Hong Kong
      year: Jul. 2026 - Present
      description:
        - Selected as 1 of 40 students for a fully funded summer research internship; supervised by Prof. Chenshu Wu on privacy-preserving fall detection using low-resolution thermal (62×80 IRA) sensing.
        - Re-architected the real-time inference pipeline for NVIDIA Jetson Orin, raising throughput from 6.7 to 20.8 FPS and cutting display latency from 3 s to under 0.3 s, via a CNN feature cache (−80% encode calls), window/stride tuning, and AMP FP16.
        - Built a 45-session, 91,800-frame thermal + RGB + depth dataset with a zero-manual-annotation labelling pipeline (YOLOv8n-Pose on RGB, projected into thermal space and thermally gated).
        - Benchmarked 6 detector versions at IoU@0.5, cutting false positives on empty frames from 40.7% to 1.5%; traced dominant error to preprocessing rather than model capacity (10× FPR reduction from one line).
    - title: Undergraduate Research Assistant
      institution: <a href="https://icclabo.github.io/icc/" target="_blank">Intelligence, Computing and Communication Lab (ICCL)</a>, VinUniversity & Trinity College Dublin
      year: Oct. 2023 - Present
      description:
        - Supervised by Assist. Prof. Nguyen Van Dinh. Investigated Open RAN architecture, 5G networks, and Task-Oriented Semantic Communication.
        - Developed multi-modality AI models for smart aquaculture (computer vision for fish tracking, underwater size estimation, image segmentation).
        - Explored Diffusion Models for enhanced data generation and signal processing.
        - Recipient of a $3,500 Student Research Grant to lead smart aquaculture research.
    - title: Project Intern (Top 20 Finalist, IoT Challenge)
      institution: FPT Software, Ha Noi, Vietnam
      year: May 2025 - Sep. 2025
      description:
        - Deployed quantized LLMs (LLaMA/Mistral with GGUF) on Raspberry Pi to build a conversational assistant.
        - Engineered a full-stack solution (Frontend/Backend) for real-time shopper tracking and route optimization via BLE localization.
    - title: Research Consultant
      institution: WorldQuant, Remote
      year: Sep. 2024 - May 2025
